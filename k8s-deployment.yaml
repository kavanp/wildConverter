# WildConverter Kubernetes Deployment
# Apply with: kubectl apply -f k8s-deployment.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: wildconverter

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildconverter
  namespace: wildconverter
  labels:
    app: wildconverter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wildconverter
  template:
    metadata:
      labels:
        app: wildconverter
    spec:
      containers:
        - name: wildconverter
          image: wildconverter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: FLASK_ENV
              value: "production"
          # Temp directory for file conversions
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: wildconverter-service
  namespace: wildconverter
  labels:
    app: wildconverter
spec:
  type: ClusterIP
  selector:
    app: wildconverter
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildconverter-ingress
  namespace: wildconverter
  annotations:
    # Adjust these based on your ingress controller
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: wildconverter.example.com  # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wildconverter-service
                port:
                  number: 80

---
# Horizontal Pod Autoscaler (optional)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wildconverter-hpa
  namespace: wildconverter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wildconverter
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
