# WildConverter Service
# Exposes the application internally within the cluster

apiVersion: v1
kind: Service
metadata:
  name: wildconverter-service
  namespace: wildconverter
  labels:
    app: wildconverter
spec:
  type: ClusterIP
  selector:
    app: wildconverter
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
